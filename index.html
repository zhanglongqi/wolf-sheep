<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wolf and Sheep Game</title>
  <style>
    /* 设置游戏容器的样式，背景透明 */
    #game-container {
      background-color: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    /* Portrait: the canvas is taller than one viewport by design (top status
       band + board + bottom settings band) — let the page scroll natively to
       reveal the rest instead of clipping it inside a fixed 100vh box. The
       `portrait` class is set once at load by src/game.js. */
    body.portrait #game-container {
      height: auto;
      min-height: 100vh;
      align-items: flex-start;
    }

    body {
      background-color: black;
    }
  </style>
</head>

<body>
  <!-- 游戏容器 -->
  <div id="game-container"></div>
  <script type="module" src="/src/game.js"></script>
</body>

</html>
